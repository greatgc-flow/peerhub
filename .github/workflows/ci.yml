name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "31 2 * * 1"
  workflow_dispatch:
    inputs:
      full_matrix:
        description: "Run the full 2 OS × 4 Python deterministic suite for a release-candidate SHA"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ inputs.full_matrix || false }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && !(inputs.full_matrix || false) }}

jobs:
  ubuntu-full:
    if: github.event_name != 'schedule' && !(github.event_name == 'workflow_dispatch' && inputs.full_matrix)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run pyright
        run: python -m pyright
      - name: Run full deterministic suite
        run: python -u -m pytest -q --junitxml=junit/ubuntu-full.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: junit-ubuntu-full-${{ github.sha }}
          path: junit/ubuntu-full.xml
          if-no-files-found: warn

  windows-platform:
    if: github.event_name != 'schedule' && !(github.event_name == 'workflow_dispatch' && inputs.full_matrix)
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Select Windows suite
        id: suite
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          FULL_MATRIX: ${{ inputs.full_matrix || false }}
        shell: pwsh
        run: |
          $selection = python -m tools.ci_platform detect-windows-suite --event "$env:GITHUB_EVENT_NAME" --base "$env:BASE_SHA" --head "$env:HEAD_SHA"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content -Path $env:GITHUB_OUTPUT -Value $selection
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run full Windows suite for platform-sensitive changes
        if: steps.suite.outputs.windows_suite == 'full'
        run: python -u -m pytest -q --junitxml=junit/windows-full.xml
      - name: Run reviewed Windows platform-sensitive inventory
        if: steps.suite.outputs.windows_suite == 'targeted'
        run: python -u -m pytest -q -m platform_sensitive --junitxml=junit/windows-platform.xml -rs
      - name: Verify platform-sensitive inventory and reject skips
        if: steps.suite.outputs.windows_suite == 'targeted'
        run: python -m tools.ci_platform verify-junit junit/windows-platform.xml --inventory ci/platform_sensitive_tests.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: junit-windows-${{ steps.suite.outputs.windows_suite }}-${{ github.sha }}
          path: junit/windows-*.xml
          if-no-files-found: warn

  compatibility-smoke:
    if: github.event_name != 'schedule' && !(github.event_name == 'workflow_dispatch' && inputs.full_matrix)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: python -m pip install .
      - name: Smoke installed import and CLI
        run: |
          python -c "import peerhub; print(peerhub.__version__)"
          peerhub --version
          peerhub --help

  full-matrix:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full_matrix)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # This is the declared support cross-product. It runs full only weekly or
      # when explicitly requested against the selected release-candidate ref.
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run pyright
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: python -m pyright
      - name: Run full deterministic suite
        run: python -u -m pytest -q --junitxml=junit/full-matrix.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: junit-full-${{ matrix.os }}-py${{ matrix.python-version }}-${{ github.sha }}
          path: junit/full-matrix.xml
          if-no-files-found: warn
