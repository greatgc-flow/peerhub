name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    # The declared support matrix (pyproject classifiers / requires-python) is exactly this cross product (REL-010/011, TD-18).
    # Cells not yet executed by a CI run are UNVERIFIED, except windows py3.11/3.12/3.13/3.14 which are VERIFIED-LOCAL (evidence docs/m1_impl/matrix_evidence/windows-py3.11-3.13.json
    # for 3.11-3.13; 3.14 run live); all ubuntu cells are UNVERIFIED. A green CI run is what verifies a cell in CI.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: "pip"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]

    - name: Install fake AI-CLI stubs (claude.cmd/agy.exe/codex.cmd)
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/fake-bin"
        STUB_FILE="$RUNNER_TEMP/fake-peer-stub.sh"
        printf '%s\n' \
        '#!/bin/sh' \
        '# Minimal deterministic stand-in for a real AI-CLI binary, used only so' \
        '# that peerhub/adapters/registry.py::resolve_executable_path() finds a' \
        '# real, executable file on PATH -- dev machines here have the real' \
        '# claude.cmd/agy.exe/codex.cmd installed; a bare CI runner does not.' \
        '# Ignores all arguments (--version, --output-format json, etc.) and' \
        '# always succeeds with a minimal completion-shaped JSON response,' \
        '# satisfying both a plain version probe (exit 0 is enough) and the' \
        '# {is_error, result} shape each adapter output decoder looks for.' \
        'echo '"'"'{"is_error": false, "result": "ok"}'"'"'' \
        'exit 0' \
        > "$STUB_FILE"
        for name in claude.cmd agy.exe codex.cmd; do
          cp "$STUB_FILE" "$RUNNER_TEMP/fake-bin/$name"
          chmod +x "$RUNNER_TEMP/fake-bin/$name"
        done
        echo "$RUNNER_TEMP/fake-bin" >> "$GITHUB_PATH"

    - name: Run pyright
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      run: |
        python -m pyright

    - name: Run pytest
      timeout-minutes: 10
      run: |
        python -u -m pytest -q
