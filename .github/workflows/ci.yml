name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]
        
    - name: Run pyright
      run: |
        python -m pyright
        
    - name: Run pytest (unit/adapters)
      timeout-minutes: 2
      continue-on-error: true
      run: python -u -m pytest tests/unit/adapters -v --durations=20

    - name: Run pytest (unit/application)
      timeout-minutes: 2
      continue-on-error: true
      run: python -u -m pytest tests/unit/application -v --durations=20

    - name: Run pytest (unit/builtins)
      timeout-minutes: 2
      continue-on-error: true
      run: python -u -m pytest tests/unit/builtins -v --durations=20

    - name: Run pytest (unit/cli)
      timeout-minutes: 2
      continue-on-error: true
      run: python -u -m pytest tests/unit/cli -v --durations=20

    - name: Run pytest (unit/core)
      timeout-minutes: 2
      continue-on-error: true
      run: python -u -m pytest tests/unit/core -v --durations=20

    - name: Run pytest (unit/dispatch)
      timeout-minutes: 2
      continue-on-error: true
      run: python -u -m pytest tests/unit/dispatch -v --durations=20

    - name: Run pytest (unit/governance)
      timeout-minutes: 2
      continue-on-error: true
      run: python -u -m pytest tests/unit/governance -v --durations=20

    - name: Run pytest (unit/telemetry)
      timeout-minutes: 2
      continue-on-error: true
      run: python -u -m pytest tests/unit/telemetry -v --durations=20

    - name: Run pytest (unit/tools)
      timeout-minutes: 2
      continue-on-error: true
      run: python -u -m pytest tests/unit/tools -v --durations=20

    - name: Run pytest (integration)
      timeout-minutes: 8
      continue-on-error: true
      run: python -u -m pytest tests/integration -v --durations=20
