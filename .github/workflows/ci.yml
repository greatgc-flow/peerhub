name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # The declared support matrix (pyproject classifiers / requires-python) is exactly this cross product (REL-010/011, TD-18).
    # Historical recorded head: all 8 cells VERIFIED-CI, run https://github.com/greatgc-flow/peerhub/actions/runs/37189754726.
    # This candidate must rerun the matrix; the retained evidence does not verify a changed worktree.
    # (evidence docs/m1_impl/matrix_evidence/ci-run-37189754726.json; tests/communication/package/test_rel_matrix.py requires it). A cell without run evidence is UNVERIFIED (TD-18).
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60  # the full deterministic suite takes ~20 min on windows runners (process-spawn heavy)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: "pip"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]


    - name: Run pyright
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      run: |
        python -m pyright

    - name: Run pytest
      timeout-minutes: 45
      run: |
        python -u -m pytest -q --junitxml=junit/matrix.xml

    - name: Retain this candidate's matrix results
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: matrix-${{ matrix.os }}-py${{ matrix.python-version }}
        path: junit/matrix.xml
