name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "31 2 * * 1"
  workflow_dispatch:
    inputs:
      full_matrix:
        description: "Run the full 2 OS × 4 Python deterministic suite for a release-candidate SHA"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ubuntu-full:
    if: github.event_name != 'schedule' && !(github.event_name == 'workflow_dispatch' && inputs.full_matrix) && (github.ref == 'refs/heads/main' || github.event_name != 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Verify platform-sensitive marker inventory
        run: python -m tools.ci_platform verify-marker-inventory --inventory ci/platform_sensitive_tests.txt
      - name: Run pyright
        run: python -m pyright
      - name: Run full deterministic suite
        run: python -u -m pytest -q --junitxml=junit/ubuntu-full.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: junit-ubuntu-full-${{ github.sha }}-${{ github.run_id }}
          path: junit/ubuntu-full.xml
          if-no-files-found: warn
          retention-days: 7
          overwrite: true

  windows-platform:
    if: github.event_name != 'schedule' && !(github.event_name == 'workflow_dispatch' && inputs.full_matrix) && (github.ref == 'refs/heads/main' || github.event_name != 'push')
    runs-on: windows-latest
    timeout-minutes: 35
    outputs:
      windows_suite: ${{ steps.suite.outputs.windows_suite }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Select Windows suite
        id: suite
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          TARGET_REF: ${{ github.ref }}
        shell: pwsh
        run: |
          $selection = python -m tools.ci_platform detect-windows-suite --event "$env:GITHUB_EVENT_NAME" --ref "$env:TARGET_REF" --base "$env:BASE_SHA" --head "$env:HEAD_SHA"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content -Path $env:GITHUB_OUTPUT -Value $selection
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        if: steps.suite.outputs.windows_suite != 'skip'
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        if: steps.suite.outputs.windows_suite != 'skip'
        run: python -m pip install -e ".[dev]"
      - name: Run full Windows suite for platform-sensitive changes
        if: steps.suite.outputs.windows_suite == 'full'
        run: python -u -m pytest -q --junitxml=junit/windows-full.xml
      - name: Run reviewed Windows platform-sensitive inventory
        if: steps.suite.outputs.windows_suite == 'targeted'
        run: python -u -m pytest -q -m platform_sensitive --junitxml=junit/windows-platform.xml -rs
      - name: Verify platform-sensitive inventory and reject skips
        if: steps.suite.outputs.windows_suite == 'targeted'
        run: python -m tools.ci_platform verify-junit junit/windows-platform.xml --inventory ci/platform_sensitive_tests.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: junit-windows-${{ steps.suite.outputs.windows_suite }}-${{ github.sha }}-${{ github.run_id }}
          path: junit/windows-*.xml
          if-no-files-found: warn
          retention-days: 7
          overwrite: true

  compatibility-smoke:
    if: github.event_name != 'schedule' && !(github.event_name == 'workflow_dispatch' && inputs.full_matrix)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: python -m pip install .
      - name: Smoke installed import and CLI
        run: |
          python -c "import peerhub; print(peerhub.__version__)"
          peerhub --version
          peerhub --help

  full-matrix:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full_matrix)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # This is the declared support cross-product. It runs full only weekly or
      # when explicitly requested against the selected release-candidate ref.
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run pyright
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: python -m pyright
      - name: Run full deterministic suite
        run: python -u -m pytest -q --junitxml=junit/full-matrix.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: junit-full-${{ matrix.os }}-py${{ matrix.python-version }}-${{ github.sha }}-${{ github.run_id }}
          path: junit/full-matrix.xml
          if-no-files-found: warn
          retention-days: 7
          overwrite: true

  pytest-oracle-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        pytest-version: ["8.0.0", "9.1.1"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Select pytest compatibility version
        run: python -m pip install "pytest==${{ matrix.pytest-version }}"
      - name: Run REL-005 oracle and pytest hook contract tests
        run: python -u -m pytest -q tests/communication/package/test_rel005_oracle.py

  ci-pass:
    if: always()
    needs: [ubuntu-full, windows-platform, compatibility-smoke, full-matrix, pytest-oracle-compat]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Verify required CI lanes
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_FULL_MATRIX: ${{ inputs.full_matrix || false }}
          WINDOWS_SUITE: ${{ needs.windows-platform.outputs.windows_suite || 'skip' }}
          UBUNTU_RESULT: ${{ needs.ubuntu-full.result }}
          WINDOWS_RESULT: ${{ needs.windows-platform.result }}
          SMOKE_RESULT: ${{ needs.compatibility-smoke.result }}
          MATRIX_RESULT: ${{ needs.full-matrix.result }}
          PYTEST_ORACLE_RESULT: ${{ needs.pytest-oracle-compat.result }}
        run: >-
          python -m tools.ci_platform verify-ci-results
          --event "$EVENT_NAME" --run-full-matrix "$RUN_FULL_MATRIX"
          --windows-suite "$WINDOWS_SUITE"
          --ubuntu-full-result "$UBUNTU_RESULT"
          --windows-platform-result "$WINDOWS_RESULT"
          --compatibility-smoke-result "$SMOKE_RESULT"
          --full-matrix-result "$MATRIX_RESULT"
          --pytest-oracle-compat-result "$PYTEST_ORACLE_RESULT"
