name: Live provider protocol gate

on:
  workflow_dispatch: {}
  pull_request:
    branches: [ "main" ]
    paths:
      - "peerhub/extensions/adapters/**"
      - "peerhub/config_data/**"
      - "peerhub/extensions/quota_*.py"
      - "peerhub/cli/**"
      - "tests/communication/live/**"
      - ".github/workflows/live-protocol-gate.yml"

permissions:
  contents: read

concurrency:
  group: live-protocol-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  live-provider-validation:
    # Never execute fork-controlled code on the persistent machine that holds
    # authenticated paid-provider CLIs. A maintainer can review a fork PR and
    # run this workflow manually against a trusted ref when live proof is needed.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    # Authentication and paid-provider CLIs must remain on a dedicated local
    # runner; GitHub-hosted runners intentionally cannot satisfy this gate.
    runs-on: [self-hosted, Windows, X64, peerhub-live]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Use an isolated venv from the runner's own Python
        # actions/setup-python cannot install into a self-hosted toolcache without admin rights (it hung on this runner), and
        # `pip install -e .[dev]` into the runner's own environment would replace its peerhub install: build a throwaway venv.
        shell: pwsh
        run: |
          python -c "import sys; assert sys.version_info >= (3, 11), sys.version"
          python -m virtualenv "$env:RUNNER_TEMP\peerhub-live-venv"
          "$env:RUNNER_TEMP\peerhub-live-venv\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Verify authenticated provider CLIs
        shell: pwsh
        run: |
          Get-Command agy.exe -ErrorAction Stop
          Get-Command claude.cmd -ErrorAction Stop
          Get-Command codex.cmd -ErrorAction Stop
      - name: Run runtime canaries (opt-in PEERHUB_LIVE=1, marker live)
        env:
          PEERHUB_LIVE: "1"
        run: python -u -m pytest -q -m live tests/communication/live
      - name: Run real adapter and quota probes
        env:
          PEERHUB_LIVE: "1"
        run: python -u -m pytest -q -m slow tests/communication/live
      - name: Run public ask scenarios
        env:
          PEERHUB_LIVE: "1"
        run: python -u -m pytest -q -m e2e tests/communication/live
