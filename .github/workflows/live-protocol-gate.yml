name: Live provider protocol gate

on:
  workflow_dispatch: {}
  pull_request:
    branches: [ "main" ]
    paths:
      - "peerhub/adapters/**"
      - "peerhub/config_data/**"
      - "peerhub/core/binary_resolution.py"
      - "peerhub/telemetry/**"
      - "tests/integration/adapters/**"
      - "tests/integration/telemetry/test_real_quota_polling.py"
      - "tests/e2e/**"
      - ".github/workflows/live-protocol-gate.yml"

permissions:
  contents: read

concurrency:
  group: live-protocol-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  live-provider-validation:
    # Never execute fork-controlled code on the persistent machine that holds
    # authenticated paid-provider CLIs. A maintainer can review a fork PR and
    # run this workflow manually against a trusted ref when live proof is needed.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    # Authentication and paid-provider CLIs must remain on a dedicated local
    # runner; GitHub-hosted runners intentionally cannot satisfy this gate.
    runs-on: [self-hosted, Windows, X64, peerhub-live]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Verify authenticated provider CLIs
        shell: pwsh
        run: |
          Get-Command agy.exe -ErrorAction Stop
          Get-Command claude.cmd -ErrorAction Stop
          Get-Command codex.cmd -ErrorAction Stop
      - name: Run real adapter and quota probes
        run: python -u -m pytest -q -m slow
      - name: Run genuine dispatch scenarios
        run: python -u -m pytest -q -m e2e
