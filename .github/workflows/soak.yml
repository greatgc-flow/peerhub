name: Scheduled soak (evidence only)

# Gate G6 (release-gates.json): non-blocking, on_fail OBSERVE. Capacity numbers are evidence only (no SLO ratified);
# hard correctness oracles still fail the job, but publish.yml never depends on this workflow.
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      scale:
        description: "Soak scale (smoke | moderate | full)"
        default: "moderate"

permissions:
  contents: read

jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PEERHUB_SOAK: "1"
      PEERHUB_SOAK_SCALE: ${{ github.event.inputs.scale || 'moderate' }}
      PEERHUB_SOAK_EVIDENCE_DIR: soak-evidence
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Run soak (SOAK-001, SOAK-002)
        run: python -u -m pytest -q -m soak tests/communication/soak
      - name: Upload evidence JSON
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: soak-evidence
          path: soak-evidence/*.json
          if-no-files-found: warn
