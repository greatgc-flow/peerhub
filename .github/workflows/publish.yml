name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.event.release.tag_name || github.run_id }}
  cancel-in-progress: false

jobs:
  gate-g0-fast:
    # G0 fast (architecture/schema/unit/property/meta/security-static) (release-gates.json): blocking; publish needs it directly and via the evidence job.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run G0 fast (architecture/schema/unit/property/meta/security-static) tests
        run: python -u -m pytest -q --junitxml=junit/g0.xml tests/m1/architecture tests/m1/schema tests/unit/m1 tests/m1/property tests/m1/meta tests/m1/security
      - name: Bind G0 JUnit to the cutover candidate (source, selector, policy, gate definitions)
        if: always()
        run: python -m tools.m1_release_evidence --stamp-junit junit/g0.xml --commit "$(git rev-parse HEAD)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: junit-g0
          path: junit/g0.xml

  gate-g1-core:
    # G1 core (SQLite/concurrency/multiprocess/fault/migration) (release-gates.json): blocking; publish needs it directly and via the evidence job.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [gate-g0-fast]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run G1 core (SQLite/concurrency/multiprocess/fault/migration) tests
        run: python -u -m pytest -q --junitxml=junit/g1.xml tests/m1/core tests/m1/migration tests/m1/concurrency tests/m1/fault tests/m1/integration
      - name: Bind G1 JUnit to the cutover candidate (source, selector, policy, gate definitions)
        if: always()
        run: python -m tools.m1_release_evidence --stamp-junit junit/g1.xml --commit "$(git rev-parse HEAD)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: junit-g1
          path: junit/g1.xml

  gate-g2-m1:
    # G2 M1 (Bridge/Observation/Diag/fake-runtime E2E) (release-gates.json): blocking; publish needs it directly and via the evidence job.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [gate-g1-core]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run G2 M1 (Bridge/Observation/Diag/fake-runtime E2E) tests
        run: python -u -m pytest -q --junitxml=junit/g2.xml tests/m1/bridge tests/m1/observation tests/m1/diag tests/m1/control tests/m1/adapters tests/m1/e2e
      - name: Bind G2 JUnit to the cutover candidate (source, selector, policy, gate definitions)
        if: always()
        run: python -m tools.m1_release_evidence --stamp-junit junit/g2.xml --commit "$(git rev-parse HEAD)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: junit-g2
          path: junit/g2.xml

  # Releases intentionally wait for real provider validation. Keep the
  # credential-bearing runner offline except while reviewing a trusted release
  # or workflow dispatch; an unavailable runner must block, not bypass, publish.
  live-validation:
    # G3 (release-gates.json). Opt-in: PEERHUB_M1_LIVE=1 AND `-m live` (LIVE-CC-001, LIVE-CX-001, LIVE-AG-001, LIVE-004, LIVE-005, LIVE-006).
    needs: [gate-g2-m1]
    runs-on: [self-hosted, Windows, X64, peerhub-live]
    timeout-minutes: 30
    env:
      PEERHUB_M1_LIVE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
      - name: Use an isolated venv from the runner's own Python
        # actions/setup-python cannot install into a self-hosted toolcache without admin rights (it hung on this runner), and
        # `pip install -e .[dev]` into the runner's own environment would replace its peerhub install: build a throwaway venv.
        shell: pwsh
        run: |
          python -c "import sys; assert sys.version_info >= (3, 11), sys.version"
          python -m virtualenv "$env:RUNNER_TEMP\peerhub-live-venv"
          "$env:RUNNER_TEMP\peerhub-live-venv\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Verify authenticated provider CLIs
        shell: pwsh
        run: |
          Get-Command agy.exe -ErrorAction Stop
          Get-Command claude.cmd -ErrorAction Stop
          Get-Command codex.cmd -ErrorAction Stop
      - name: Run M1 live canaries (marker live, PEERHUB_M1_LIVE=1)
        run: python -u -m pytest -q -m live --junitxml=junit/g3.xml tests/m1/live
      - name: Run paid/live legacy release gate
        run: |
          python -u -m pytest -q -m slow --junitxml=junit/g3-slow.xml
          python -u -m pytest -q -m e2e --junitxml=junit/g3-e2e.xml
      - name: Bind G3 JUnit to the cutover candidate (source, selector, policy, gate definitions)
        if: always()
        run: python -m tools.m1_release_evidence --stamp-junit junit/g3.xml --stamp-junit junit/g3-slow.xml --stamp-junit junit/g3-e2e.xml --commit "$(git rev-parse HEAD)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: junit-g3
          path: junit/g3*.xml

  build:
    # G4 package (wheel/sdist/runtime-data/clean-install/support-matrix/restart)
    needs: [gate-g2-m1]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Verify release tag matches package version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          # pyproject.toml's [project].version is `dynamic` (P8, 2026-09-12) --
          # peerhub/_version.py is the single source of truth. Parsed as plain
          # text (not `import peerhub`) so this step doesn't need the
          # package's runtime dependencies installed yet.
          PACKAGE_VERSION="$(python -c 'import re; print(re.search(r"""__version__\s*=\s*[\"\x27]([^\"\x27]+)[\"\x27]""", open("peerhub/_version.py").read()).group(1))')"
          test -n "$PACKAGE_VERSION" || {
            echo "::error::Could not parse __version__ from peerhub/_version.py"
            exit 1
          }
          test "$RELEASE_TAG" = "v$PACKAGE_VERSION" || {
            echo "::error::Release tag $RELEASE_TAG does not match v$PACKAGE_VERSION"
            exit 1
          }
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run G4 package tests
        run: python -u -m pytest -q --junitxml=junit/g4.xml tests/m1/package
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Bind G4 JUnit to the cutover candidate (source, selector, policy, gate definitions)
        if: always()
        run: python -m tools.m1_release_evidence --stamp-junit junit/g4.xml --commit "$(git rev-parse HEAD)" --dist dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: junit-g4
          path: junit/g4.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/

  gate-g7-invariant:
    # G7 zero-tolerance invariant scan: every catalog id is traced to a test and the architecture/invariant checks pass again on a clean checkout.
    needs: [live-validation, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Traceability scan (no missing ids)
        run: python -m tools.m1_traceability
      - name: Invariant scan
        run: python -u -m pytest -q tests/m1/architecture tests/m1/meta

  release-evidence:
    # G5 evidence index + hashes: fails (exit 1) unless every blocking catalog test passed and every requirement is covered.
    needs: [gate-g0-fast, gate-g1-core, gate-g2-m1, live-validation, build, gate-g7-invariant]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: junit-*
          path: junit/
          merge-multiple: true
      - name: Generate release evidence bundle
        run: python -m tools.m1_release_evidence --junit junit/g0.xml --junit junit/g1.xml --junit junit/g2.xml --junit junit/g3.xml --junit junit/g3-slow.xml --junit junit/g3-e2e.xml --junit junit/g4.xml --dist dist --out evidence --commit "$(git rev-parse HEAD)" --candidate --policy-file docs/m1_spec/08_LIFECYCLE/gate-evidence-policy.json --release-policy docs/m1_impl/release-policy.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: release-evidence
          path: evidence/

  publish:
    needs: [gate-g0-fast, gate-g1-core, gate-g2-m1, live-validation, build, gate-g7-invariant, release-evidence]
    # Manual dispatch is a safe live-validation/build dry run. Only a published
    # GitHub Release may mint an OIDC token and publish the resulting artifact.
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
