name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.event.release.tag_name || github.run_id }}
  cancel-in-progress: false

jobs:
  live-validation:
    runs-on: [self-hosted, Windows, X64, peerhub-live]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Verify authenticated provider CLIs
        shell: pwsh
        run: |
          Get-Command agy.exe -ErrorAction Stop
          Get-Command claude.cmd -ErrorAction Stop
          Get-Command codex.cmd -ErrorAction Stop
      - name: Run paid/live release gate
        run: |
          python -u -m pytest -q -m slow
          python -u -m pytest -q -m e2e

  build:
    needs: live-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Verify release tag matches package version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          # pyproject.toml's [project].version is `dynamic` (P8, 2026-09-12) --
          # peerhub/_version.py is the single source of truth. Parsed as plain
          # text (not `import peerhub`) so this step doesn't need the
          # package's runtime dependencies installed yet.
          PACKAGE_VERSION="$(python -c 'import re; print(re.search(r"""__version__\s*=\s*[\"\x27]([^\"\x27]+)[\"\x27]""", open("peerhub/_version.py").read()).group(1))')"
          test -n "$PACKAGE_VERSION" || {
            echo "::error::Could not parse __version__ from peerhub/_version.py"
            exit 1
          }
          test "$RELEASE_TAG" = "v$PACKAGE_VERSION" || {
            echo "::error::Release tag $RELEASE_TAG does not match v$PACKAGE_VERSION"
            exit 1
          }
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    # Manual dispatch is a safe live-validation/build dry run. Only a published
    # GitHub Release may mint an OIDC token and publish the resulting artifact.
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
