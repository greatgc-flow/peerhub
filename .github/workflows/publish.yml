name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      evidence_tag:
        description: "Release tag whose assets hold the locally produced G3 evidence (dry runs)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.event.release.tag_name || github.run_id }}
  cancel-in-progress: false

jobs:
  gate-g0-fast:
    # G0 fast (architecture/schema/unit/property/meta/security-static) (release-gates.json): blocking; publish needs it directly and via the evidence job.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run G0 fast (architecture/schema/unit/property/meta/security-static) tests
        run: python -u -m pytest -q --junitxml=junit/g0.xml tests/communication/architecture tests/communication/schema tests/communication/unit tests/communication/property tests/communication/meta tests/communication/security
      - name: Bind G0 JUnit to the cutover candidate (source, selector, policy, gate definitions)
        if: always()
        run: python -m tools.release_evidence --stamp-junit junit/g0.xml --gate G0 --commit "$(git rev-parse HEAD)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: junit-g0
          path: junit/g0.xml

  gate-g1-core:
    # G1 core (SQLite/concurrency/multiprocess/fault/migration) (release-gates.json): blocking; publish needs it directly and via the evidence job.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [gate-g0-fast]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run G1 core (SQLite/concurrency/multiprocess/fault/migration) tests
        run: python -u -m pytest -q --junitxml=junit/g1.xml tests/communication/core tests/communication/migration tests/communication/concurrency tests/communication/fault tests/communication/integration
      - name: Bind G1 JUnit to the cutover candidate (source, selector, policy, gate definitions)
        if: always()
        run: python -m tools.release_evidence --stamp-junit junit/g1.xml --gate G1 --commit "$(git rev-parse HEAD)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: junit-g1
          path: junit/g1.xml

  gate-g2-extensions:
    # G2 M1 (Bridge/Observation/Diag/fake-runtime E2E) (release-gates.json): blocking; publish needs it directly and via the evidence job.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [gate-g1-core]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run G2 M1 (Bridge/Observation/Diag/fake-runtime E2E) tests
        run: python -u -m pytest -q --junitxml=junit/g2.xml tests/communication/bridge tests/communication/observation tests/communication/diag tests/communication/control tests/communication/adapters tests/communication/e2e
      - name: Bind G2 JUnit to the cutover candidate (source, selector, policy, gate definitions)
        if: always()
        run: python -m tools.release_evidence --stamp-junit junit/g2.xml --gate G2 --commit "$(git rev-parse HEAD)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: junit-g2
          path: junit/g2.xml

  # Provider CLIs are logged in only on the maintainer's machine, so the live gate never runs on a remote runner.
  # `python -m tools.live_gate --yes` (clean checkout of the release commit) writes g3.xml / g3-slow.xml / g3-e2e.xml bound to that
  # commit; the maintainer attaches them to the GitHub Release (`gh release upload <tag> .peerhub/work/live-gate/g3*.xml`). This job only
  # fetches those three exact files into an isolated directory; missing files fail it (publish stays blocked), and the
  # release-evidence job below still verifies candidate binding, freshness and PASS of every live catalog test.
  live-validation:
    # G3 (release-gates.json): LIVE-CC-001, LIVE-CX-001, LIVE-AG-001, LIVE-004, LIVE-005, LIVE-006 come from the local evidence.
    needs: [gate-g2-extensions]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch the locally produced G3 evidence from the Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_TAG: ${{ github.event.release.tag_name || inputs.evidence_tag }}
        run: |
          if [ -z "$EVIDENCE_TAG" ]; then
            echo "::error::No release tag to read G3 evidence from (manual runs need the evidence_tag input)"
            exit 1
          fi
          mkdir -p g3-assets junit
          gh release download "$EVIDENCE_TAG" --repo "$GITHUB_REPOSITORY" --dir g3-assets             --pattern g3.xml --pattern g3-slow.xml --pattern g3-e2e.xml
          for f in g3.xml g3-slow.xml g3-e2e.xml; do
            test -s "g3-assets/$f" || { echo "::error::Release $EVIDENCE_TAG has no $f (run tools.live_gate locally and upload it)"; exit 1; }
            cp "g3-assets/$f" "junit/$f"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: junit-g3
          path: junit/g3*.xml

  build:
    # G4 package (wheel/sdist/runtime-data/clean-install/support-matrix/restart)
    needs: [gate-g2-extensions]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Verify release tag matches package version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          # pyproject.toml's [project].version is `dynamic` (P8, 2026-09-12) --
          # peerhub/_version.py is the single source of truth. Parsed as plain
          # text (not `import peerhub`) so this step doesn't need the
          # package's runtime dependencies installed yet.
          PACKAGE_VERSION="$(python -c 'import re; print(re.search(r"""__version__\s*=\s*[\"\x27]([^\"\x27]+)[\"\x27]""", open("peerhub/_version.py").read()).group(1))')"
          test -n "$PACKAGE_VERSION" || {
            echo "::error::Could not parse __version__ from peerhub/_version.py"
            exit 1
          }
          test "$RELEASE_TAG" = "v$PACKAGE_VERSION" || {
            echo "::error::Release tag $RELEASE_TAG does not match v$PACKAGE_VERSION"
            exit 1
          }
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run G4 package tests
        run: python -u -m pytest -q --junitxml=junit/g4.xml tests/communication/package
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Bind G4 JUnit to the cutover candidate (source, selector, policy, gate definitions)
        if: always()
        run: python -m tools.release_evidence --stamp-junit junit/g4.xml --gate G4 --commit "$(git rev-parse HEAD)" --dist dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: junit-g4
          path: junit/g4.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/

  gate-g7-invariant:
    # G7 zero-tolerance invariant scan: every catalog id is traced to a test and the architecture/invariant checks pass again on a clean checkout.
    needs: [live-validation, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Traceability scan (no missing ids)
        run: python -m tools.traceability
      - name: Invariant scan
        run: python -u -m pytest -q tests/communication/architecture tests/communication/meta

  release-evidence:
    # G5 evidence index + hashes: fails (exit 1) unless every blocking catalog test passed and every requirement is covered.
    needs: [gate-g0-fast, gate-g1-core, gate-g2-extensions, live-validation, build, gate-g7-invariant]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: junit-*
          path: junit/
          merge-multiple: true
      - name: Generate release evidence bundle
        run: python -m tools.release_evidence --junit junit/g0.xml --junit junit/g1.xml --junit junit/g2.xml --junit junit/g3.xml --junit junit/g3-slow.xml --junit junit/g3-e2e.xml --junit junit/g4.xml --dist dist --out evidence --commit "$(git rev-parse HEAD)" --candidate --policy-file docs/m1_spec/08_LIFECYCLE/gate-evidence-policy.json --release-policy docs/m1_impl/release-policy.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: release-evidence
          path: evidence/

  publish:
    needs: [gate-g0-fast, gate-g1-core, gate-g2-extensions, live-validation, build, gate-g7-invariant, release-evidence]
    # Manual dispatch is a safe live-validation/build dry run. Only a published
    # GitHub Release may mint an OIDC token and publish the resulting artifact.
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
