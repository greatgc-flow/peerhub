name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      evidence_tag:
        description: "Release tag whose assets hold the locally produced G3 evidence (dry runs)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.event.release.tag_name || github.run_id }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Traceability scan (no missing ids)
        run: python -m tools.traceability

  candidate-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      run-url: ${{ steps.candidate-ci.outputs.run-url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Select the exact candidate CI run
        id: candidate-ci
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          candidate_sha="$(git rev-parse HEAD)"
          if [[ "$GITHUB_EVENT_NAME" == release ]]; then
            tag_sha="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
            test "$tag_sha" = "$candidate_sha" || {
              echo "::error::Release tag $RELEASE_TAG differs from the checkout"
              exit 1
            }
          fi
          test "$candidate_sha" = "$GITHUB_SHA" || {
            echo "::error::Candidate checkout differs from the event SHA"
            exit 1
          }
          python -m tools.release_ci --repo "$GITHUB_REPOSITORY" --commit "$candidate_sha" >> "$GITHUB_OUTPUT"
      - name: Download candidate CI reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.candidate-ci.outputs.run-id }}
          pattern: junit-g2-rc-matrix-*
          path: ci-junit/
      - name: Verify all candidate CI reports and source catalog coverage
        run: python -m tools.release_evidence --verify-ci-junit ci-junit --verify-source-catalog --commit "$GITHUB_SHA" --release-policy docs/m1_impl/release-policy.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: candidate-ci-junit
          path: ci-junit/
          if-no-files-found: error

  # Provider CLIs are logged in only on the maintainer's machine, so the live gate never runs on a remote runner.
  # `python -m tools.live_gate --yes` (clean checkout of the release commit) writes g3.xml / g3-slow.xml / g3-e2e.xml bound to that
  # commit; the maintainer attaches them to the GitHub Release (`gh release upload <tag> .peerhub/work/live-gate/g3*.xml`). This job only
  # fetches those three exact files into an isolated directory; missing files fail it (publish stays blocked), and the
  # release-evidence job below still verifies candidate binding, freshness and PASS of every live catalog test.
  live-validation:
    # G3 (release-gates.json): LIVE-CC-001, LIVE-CX-001, LIVE-AG-001, LIVE-004, LIVE-005, LIVE-006, LIVE-007, LIVE-008 come from the local evidence.
    needs: [verify, candidate-ci]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch the locally produced G3 evidence from the Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_TAG: ${{ github.event.release.tag_name || inputs.evidence_tag }}
        run: |
          if [ -z "$EVIDENCE_TAG" ]; then
            echo "::error::No release tag to read G3 evidence from (manual runs need the evidence_tag input)"
            exit 1
          fi
          mkdir -p g3-assets junit
          gh release download "$EVIDENCE_TAG" --repo "$GITHUB_REPOSITORY" --dir g3-assets             --pattern g3.xml --pattern g3-slow.xml --pattern g3-e2e.xml
          for f in g3.xml g3-slow.xml g3-e2e.xml; do
            test -s "g3-assets/$f" || { echo "::error::Release $EVIDENCE_TAG has no $f (run tools.live_gate locally and upload it)"; exit 1; }
            cp "g3-assets/$f" "junit/$f"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: junit-g3
          path: junit/g3*.xml

  build:
    # G4 package (wheel/sdist/runtime-data/clean-install/support-matrix/restart)
    needs: [verify, candidate-ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Verify release tag matches package version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          PACKAGE_VERSION="$(python -c 'from tools.release_evidence import source_version; print(source_version())')"
          test "$RELEASE_TAG" = "v$PACKAGE_VERSION" || {
            echo "::error::Release tag $RELEASE_TAG does not match v$PACKAGE_VERSION"
            exit 1
          }
          TAG_SHA="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          test "$TAG_SHA" = "$GITHUB_SHA" || {
            echo "::error::Release tag $RELEASE_TAG moved after this workflow event"
            exit 1
          }
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]" twine
      - name: Build sdist and wheel
        run: |
          python -m build
          python -m twine check --strict dist/*
      - name: Run G4 package tests against the built distributions
        env:
          PEERHUB_DIST_DIR: ${{ github.workspace }}/dist
        run: python -u -m pytest -q -n auto --junitxml=junit/g4.xml tests/communication/package --ignore=tests/communication/package/test_rel_matrix.py
      - name: Bind G4 JUnit to the cutover candidate (source, policy, gate definitions)
        if: always()
        run: python -m tools.release_evidence --stamp-junit junit/g4.xml --gate G4 --commit "$(git rev-parse HEAD)" --dist dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: junit-g4
          path: junit/g4.xml
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist
          path: dist/

  matrix:
    # G4 support matrix (REL-010/011, TD-18): every declared Python x OS cell must really pass the matrix tests for THIS candidate.
    # Each cell runs only its own environment against the downloaded dist; the results are stamped to the candidate and the exact
    # built wheels (package scope). Archived runs never count.
    needs: [build]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist/
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run the support-matrix tests on this cell
        env:
          PEERHUB_DIST_DIR: ${{ github.workspace }}/dist
        run: python -u -m pytest -q --junitxml="junit/g4-matrix-${{ matrix.os }}-py${{ matrix.python-version }}.xml" tests/communication/package/test_rel_matrix.py
      - name: Bind this cell's JUnit to the candidate (commit, policy, exact wheels)
        if: always()
        run: python -m tools.release_evidence --stamp-junit "junit/g4-matrix-${{ matrix.os }}-py${{ matrix.python-version }}.xml" --gate G4 --commit "$(git rev-parse HEAD)" --dist dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: junit-g4-matrix-${{ matrix.os }}-py${{ matrix.python-version }}
          path: junit/g4-matrix-*.xml
          if-no-files-found: error

  release-evidence:
    # G5 evidence index + hashes: fails (exit 1) unless every blocking catalog test passed and every requirement is covered.
    needs: [verify, candidate-ci, live-validation, build, matrix]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: candidate-ci-junit
          path: ci-junit/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: junit-*
          path: junit/
          merge-multiple: true
      - name: Generate release evidence bundle
        env:
          CI_RUN_URL: ${{ needs.candidate-ci.outputs.run-url }}
        run: |
          junit_args=(--junit junit/g3.xml --junit junit/g3-slow.xml --junit junit/g3-e2e.xml --junit junit/g4.xml)
          python -m tools.release_evidence "${junit_args[@]}" --dist dist --out evidence --commit "$(git rev-parse HEAD)" --candidate --policy-file docs/m1_spec/08_LIFECYCLE/gate-evidence-policy.json --release-policy docs/m1_impl/release-policy.json --ci-junit-dir ci-junit --ci-run-url "$CI_RUN_URL" --g4-matrix-dir junit
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: release-evidence
          path: evidence/

  publish:
    needs: [verify, live-validation, build, matrix, release-evidence]
    # Manual dispatch is a safe live-validation/build dry run. Only a published
    # GitHub Release may mint an OIDC token and publish the resulting artifact.
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
