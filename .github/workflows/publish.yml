name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.event.release.tag_name || github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Verify release tag matches package version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          # pyproject.toml's [project].version is `dynamic` (P8, 2026-09-12) --
          # peerhub/_version.py is the single source of truth. Parsed as plain
          # text (not `import peerhub`) so this step doesn't need the
          # package's runtime dependencies installed yet.
          PACKAGE_VERSION="$(python -c 'import re; print(re.search(r"""__version__\s*=\s*[\"\x27]([^\"\x27]+)[\"\x27]""", open("peerhub/_version.py").read()).group(1))')"
          test -n "$PACKAGE_VERSION" || {
            echo "::error::Could not parse __version__ from peerhub/_version.py"
            exit 1
          }
          test "$RELEASE_TAG" = "v$PACKAGE_VERSION" || {
            echo "::error::Release tag $RELEASE_TAG does not match v$PACKAGE_VERSION"
            exit 1
          }
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
