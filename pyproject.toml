[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "peerhub"
dynamic = ["version"]
description = "Local transactional coordination for collaborating AI peers"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["ai-agents", "cli", "coordination", "multi-agent", "orchestration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Utilities",
]
requires-python = ">=3.11,<3.15"
dependencies = [
    "jsonschema>=4.18",
    "psutil>=5.9.0",
    "pydantic>=2.0",
    "typing_extensions>=4.6.0",
]

[project.urls]
Homepage = "https://github.com/greatgc-flow/peerhub"
Repository = "https://github.com/greatgc-flow/peerhub"
Issues = "https://github.com/greatgc-flow/peerhub/issues"
Changelog = "https://github.com/greatgc-flow/peerhub/releases"
CI = "https://github.com/greatgc-flow/peerhub/actions"

[project.scripts]
peerhub = "peerhub.cli:main"
peerhub-m1 = "peerhub.m1_cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-timeout>=2.3.0", "pytest-cov>=5.0", "pyright>=1.1.370", "hypothesis>=6.0", "alembic>=1.13.0",
    "build>=1.0", "setuptools>=77.0.3", "virtualenv>=20", "pyyaml>=6", "packaging>=23"]

[tool.setuptools.dynamic]
version = {attr = "peerhub._version.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["peerhub*"]

[tool.setuptools.package-data]
"peerhub.persistence.migrations" = ["*.sql"]
"peerhub.config_data" = ["*.toml"]
"peerhub.m1" = ["schemas/*.json"]
"peerhub.extensions" = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "-ra -m 'not slow and not e2e and not live and not soak'"
timeout = 60
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "e2e: marks tests as End-to-End tier (deselect with '-m \"not e2e\"')",
    "m1_id(id): M1 catalog test id (traceability, see tools/m1_traceability.py)",
    "architecture", "schema", "property", "meta", "traceability", "unit", "sqlite", "concurrency",
    "multiprocess", "fault", "migration", "bridge", "observation", "diag", "security", "package",
    "release", "clean-install", "smoke", "ci", "ci_only(python, os): declared matrix cell exercised only by CI", "evidence", "matrix", "windows", "cutover", "compatibility", "boundary", "claim", "certainty", "restart", "idempotency", "integration", "record", "canonicalization", "live", "soak", "provider", "cc", "cx", "ag", "isolation", "control", "context",
]
