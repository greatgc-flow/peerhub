[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "peerhub"
version = "0.1.0"
description = "Local transactional coordination for collaborating AI peers"
requires-python = ">=3.11"
dependencies = [
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyright>=1.1.370"]

[tool.setuptools.packages.find]
where = ["."]
include = ["peerhub*"]

[tool.setuptools.package-data]
"peerhub.persistence.migrations" = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "-ra"
