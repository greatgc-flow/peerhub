[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "peerhub"
version = "0.1.9"
description = "Local transactional coordination for collaborating AI peers"
requires-python = ">=3.11"
dependencies = [
    "psutil>=5.9.0",
    "pydantic>=2.0",
]

[project.scripts]
peerhub = "peerhub.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyright>=1.1.370", "hypothesis>=6.0", "alembic>=1.13.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["peerhub*"]

[tool.setuptools.package-data]
"peerhub.persistence.migrations" = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "-ra -m 'not slow'"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
