[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "peerhub"
version = "0.1.13"
description = "Local transactional coordination for collaborating AI peers"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["ai-agents", "cli", "coordination", "multi-agent", "orchestration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Utilities",
]
requires-python = ">=3.11"
dependencies = [
    "psutil>=5.9.0",
    "pydantic>=2.0",
    "typing_extensions>=4.6.0",
]

[project.urls]
Homepage = "https://github.com/greatgc-flow/peerhub"
Repository = "https://github.com/greatgc-flow/peerhub"
Issues = "https://github.com/greatgc-flow/peerhub/issues"
Changelog = "https://github.com/greatgc-flow/peerhub/releases"
CI = "https://github.com/greatgc-flow/peerhub/actions"

[project.scripts]
peerhub = "peerhub.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-timeout>=2.3.0", "pyright>=1.1.370", "hypothesis>=6.0", "alembic>=1.13.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["peerhub*"]

[tool.setuptools.package-data]
"peerhub.persistence.migrations" = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "-ra -m 'not slow and not e2e'"
timeout = 60
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "e2e: marks tests as End-to-End tier (deselect with '-m \"not e2e\"')",
]
