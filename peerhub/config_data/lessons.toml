issue = "0.25.0 plan D5"

[[lessons]]
id = "ask-metrics"
title = "Ask receipts, outcomes, and profile measurements"
keywords = ["receipt", "outcome", "profile stats", "profile check", "measurement", "coverage", "stream budget", "handoff", "query file"]
symptom = "You want to compare profiles, mark an answer's outcome, or understand an ask receipt or a stream budget warning."
fix = "Use peerhub profile stats --json for ask counts, coverage by metric, and reported measurements. Mark an answer with peerhub outcome <ask-id> accepted|rejected|retried. Find the ID at the start of the terminal receipt or in requested_record_id in ask JSON. The latest correction wins. A dash in the receipt means the metric was unreported. Set PEERHUB_NO_RECEIPT=1 to silence the receipt. Run peerhub profile check to find stale measurements and model IDs missing from the available Codex or agy catalog. If the stream budget warning appears, start a fresh stream with a handoff covering decisions, open work, and file references. Configure prompt_tokens and resumed_turns in [stream_budget] in models.toml. For an inlined query file over 64 KB, consider sending paths or a diff."
issue = "0.25.0 plan M2"

[[lessons]]
id = "suggest"
title = "Recommend a profile and ask command"
keywords = ["suggest", "recommend", "profile choice", "7d pace", "5h usage"]
symptom = "Choose a profile in the requested tier using quota evidence."
fix = "Run peerhub suggest --tier TIER --candidates to inspect eligibility, then omit --candidates to print an ask. See docs/batch.md#suggest-an-ask for prompt files, ranking and refresh costs."
issue = "0.25.0 plan D7/D8/A6/A7"

[[lessons]]
id = "parallel-quota"
guide_order = 11
title = "Spread parallel work over the least quota"
keywords = ["parallel", "quota", "pace", "pools", "batch", "loop", "distribute", "minimal", "ram", "free", "memory", "slots", "load", "diag", "plan", "resource", "resources"]
symptom = "Several tasks can run at once and the caller wants them spread over the pools with the most spare quota, spending as little as possible."
fix = "PeerHub gives you the facts, and you decide the wave size and pools. Read peerhub diag --plan, never peerhub monitor (the human screen). Check the load line for free RAM, CPU and in-flight asks. With --json, use the load object and pool profiles; each pool row also reports age_seconds, ttl_seconds, fast, family, parent and gates. A profile listed under several pools spends each. For a default wave, split independent tasks with no shared files. Use the lowest tier that fits, fresh asks with facts inline and a different model per vote. Use the lowest 7D PACE first (spend, then hold). Skip stale, rest, blocked, <5% and fast pools. 5H only gates. Use free RAM >= {ram_min} GB, CPU below {cpu_warn}% to size the wave. PeerHub does not cap the count. Validate with peerhub batch run tasks.json --batch-id ID --max-parallel n --dry-run. Start the wave, then after each wave run peerhub observation refresh, then diag --plan again. For parallel ag asks, watch G-5H after each wave. Keep a margin for asks in flight (including {plan_na_pools} and unmapped asks). When one task is refused for quota, the others still run. The same --batch-id replays settled work. If throttled, reduce concurrency and do not reroute the same work. After uncertainty, check peerhub diag running and peerhub diag health --stream STREAM and reconcile the workspace. If no pool is usable, defer. Agy /usage or /credits can consume model tokens. See docs/batch.md for plan details and the probe costs reference."
issue = "owner request 2026-11-22"

[[lessons]]
id = "exit-codes"
title = "CLI exit codes and error output"
keywords = ["exit", "code", "error", "stderr", "json"]
symptom = "A caller is interpreting a process exit or an error report."
fix = """\
Ask returns {ask[delivered]} for delivery, terminal replay or a valid dry run, \
{ask[uncertain]} for uncertainty or delivery failure (including denied_empty or session_lost), \
{error[ask_idempotency_conflict]} for syntax, invalid selectors or idempotency conflict, \
and {error[ask_cas_conflict]} for a compare-and-swap conflict. \
Batch run returns 0 for a valid dry run or all tasks completed and \
{error[invalid_manifest]} for an invalid manifest or unsuccessful tasks. \
An empty terminal reply without an error exits {ask[delivered]} in ask and {error[invalid_manifest]} in batch (UNVERIFIED). \
Diag health, quota, readiness, running, --plan and integrity use {diag[OK]} for OK, \
{diag[FAILED]} for a storage/read fault (including PARTIAL reports), {diag[UNAVAILABLE]} for an unavailable store, \
and {diag[SCHEMA_VERSION]} for an unsupported schema version. \
A missing alternate --observation-db with a healthy main store gives health {diag[FAILED]} (PARTIAL) and quota {diag[UNAVAILABLE]} (UNAVAILABLE). \
Diag health returns {error[stream_not_found]} for a missing stream. \
Update --check returns 0. Update --plan returns 0 when ready, {error[ask_claim_held]} if an ask is or may be running, \
and {diag[FAILED]}/{diag[UNAVAILABLE]}/{diag[SCHEMA_VERSION]} for an unreadable/missing/incompatible store. \
Suggest returns 0 for a suggestion or 1 for unavailable. Explain returns 0 for a match or 1 for no match. \
Monitor snapshot/watch use 0 for success, 1 for invalid defaults, an agy token-use stop or a failed final refresh in finite watch, and the diag store codes. \
Observation refresh returns 0 for OK or 1 for a non-OK refresh. Shared store errors use the diag store codes as applicable. \
Coded errors appear on stderr as [code] message; next: ... \
With --json, ask errors and invalid manifests can include an error object with code and message on stdout. \
Other reports use command-specific JSON. Run peerhub explain CODE for guidance."""
issue = "#446"
