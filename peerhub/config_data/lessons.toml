[[lessons]]
id = "independent-peer-votes"
guide_order = 1
title = "Independent review votes"
aliases = ["review-recipe", "batch-review-and-verify", "review-loop", "review-scores-to-100"]
keywords = ["peer", "vote", "votes", "author", "independent", "unanimity", "review", "self-vote", "batch", "responses", "verdict", "fresh", "consequential", "review-loop", "review-scores-to-100", "loop", "score", "round", "brief", "materiality", "contract", "narrow", "defects", "deduction", "unverified", "suite", "targeted", "ports", "WinError", "worktree", "cross-family", "final", "tag", "gitlink", "findings", "mechanical", "sweep", "draft", "verify", "script"]
symptom = "You need independent votes on a fixed diff, a complete sweep of findings, or a release review with deductions tied to defects."
fix = """Vote policy: routine check = ONE reviewer, FRESH; consequential (release, schema, deletion, public API) = 3 independent peers, unanimity. Use a new stream per voter: --fresh on a used stream can still include up to 100 earlier records (24 KB), even when a stream name is given. A named stream is for review rounds on one diff only. Require voters did not author the document. There is no `vote` command: run peerhub batch run votes.json --batch-id ID --max-parallel n --responses. cc/cx use the repository workspace, not writable; ag uses a private empty directory as workspace (always writable). Keep prompts inline. Reply VERDICT / BLOCKERS / NITS (<= 300 tokens). See docs/commands.md#ask.
- Ask for the complete mechanical sweep in one list and compare identifiers with a small script before voting. Check drafts against files and command output, then have a second reviewer triage objections. Give editing lanes disjoint files, keep reviewers read-only, and give Git writes to one lead. See CONTRIBUTING.md#working-with-ai-peers.
- Use the release bar in CONTRIBUTING.md#release-lessons. Paste this reviewer brief: "Score each item 0-100. Deduct only for a defect that violates a documented contract or is reachable from supported inputs. Label other findings as recommendations. For each deduction give the exact fix (file:line + change). Report unrun checks as NOT RUN." Re-review the exact shipped tag and confirm the final candidate with a reviewer from another model family. The coordinator runs the full suite once and shares the result. Reviewers run only targeted tests. Give them allow rules and run checks they could not. Record the commit and time for each live measurement. After two rounds finding new defects in one new component, narrow its contract (fail closed). Avoid `git add -A` in a checkout with agent worktrees because it stages them as gitlinks."""
issue = "#297, #298, #345, #366, 0.25.0 plan D6"

