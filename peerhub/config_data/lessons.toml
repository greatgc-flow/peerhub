[[lessons]]
id = "parallel-quota"
guide_order = 11
title = "Spread parallel work over the least quota"
keywords = ["parallel", "quota", "pace", "pools", "batch", "loop", "distribute", "minimal", "ram", "free", "memory", "slots", "load", "diag", "plan", "resource", "resources"]
symptom = "Several tasks can run at once and the caller wants them spread over the pools with the most spare quota, spending as little as possible."
fix = "Read peerhub diag --plan and choose usable pools by lowest 7D PACE first. Size the wave from the load line. Validate with peerhub batch run tasks.json --batch-id ID --max-parallel n --dry-run. Refresh quota and read the plan after each wave. See docs/batch.md#parallel-work-over-the-least-quota."
issue = "owner decisions 2026-11-22 and 2026-11-25"

[[lessons]]
id = "exit-codes"
title = "CLI exit codes and error output"
keywords = ["exit", "code", "error", "stderr", "json"]
symptom = "A caller is interpreting a process exit or an error report."
fix = """\
Ask returns {ask[delivered]} for delivery, terminal replay or a valid dry run, \
{ask[uncertain]} for uncertainty or delivery failure (including denied_empty or session_lost), \
{error[ask_idempotency_conflict]} for syntax, invalid selectors or idempotency conflict, \
and {error[ask_cas_conflict]} for a compare-and-swap conflict. \
Batch run returns 0 for a valid dry run or all tasks completed and \
{error[invalid_manifest]} for an invalid manifest or unsuccessful tasks. \
An empty terminal reply without an error exits {ask[delivered]} in ask and {error[invalid_manifest]} in batch (UNVERIFIED). \
Diag health, quota, readiness, running, --plan and integrity use {diag[OK]} for OK, \
{diag[FAILED]} for a storage/read fault (including PARTIAL reports), {diag[UNAVAILABLE]} for an unavailable store, \
and {diag[SCHEMA_VERSION]} for an unsupported schema version. \
A missing alternate --observation-db with a healthy main store gives health {diag[FAILED]} (PARTIAL) and quota {diag[UNAVAILABLE]} (UNAVAILABLE). \
Diag health returns {error[stream_not_found]} for a missing stream. \
Update --check returns 0. Update --plan returns 0 when ready, {error[ask_claim_held]} if an ask is or may be running, \
and {diag[FAILED]}/{diag[UNAVAILABLE]}/{diag[SCHEMA_VERSION]} for an unreadable/missing/incompatible store. \
Suggest returns 0 for a suggestion or 1 for unavailable. Explain returns 0 for a match or 1 for no match. \
Monitor snapshot/watch use 0 for success, 1 for invalid defaults, an agy token-use stop or a failed final refresh in finite watch, and the diag store codes. \
Observation refresh returns 0 for OK or 1 for a non-OK refresh. Shared store errors use the diag store codes as applicable. \
Coded errors appear on stderr as [code] message; next: ... \
With --json, ask errors and invalid manifests can include an error object with code and message on stdout. \
Other reports use command-specific JSON. Run peerhub explain CODE for guidance."""
issue = "#446"
