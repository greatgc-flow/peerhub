# Packaged model defaults, bundled inside the peerhub distribution.
#
# This is the LOWEST-priority layer in ModelConfigService's resolution
# order (workspace binding > global config > this file > configuration
# error). It exists so a fresh peerhub install still dispatches
# successfully without requiring a user to write config before their
# first `peerhub ask`. It is release-maintained, not user-edited -- a
# stale entry here is only ever a fallback that can be overridden
# globally (~/.peerhub/config/models.toml) or per-workspace
# (`peerhub node bind-profile`), never a silent, unfixable ceiling.
#
# Relocating a hardcoded value here does not eliminate the need to keep
# maintaining it -- see revision below and re-verify on every codex.cmd
# upgrade (the same discipline the prior `_CODEX_MODEL_OVERRIDE` Python
# constant carried).

schema_version = 1
defaults_revision = "2026-10-01.1"

[profiles."cx.standard"]
selection_mode = "pinned"
model = "gpt-6-luna"
reasoning_effort = "low"

[profiles."cx.effort"]
selection_mode = "pinned"
model = "gpt-6.1-sol"
reasoning_effort = "high"

[profiles."cx.deepthink"]
selection_mode = "pinned"
model = "gpt-6.1-sol"
reasoning_effort = "xhigh"

[profiles."cx.pro"]
selection_mode = "pinned"
model = "gpt-6-astra"
reasoning_effort = "xhigh"

[profiles."cc.standard"]
selection_mode = "pinned"
model = "claude-haiku-4-5-20251001"

[profiles."cc.effort"]
selection_mode = "pinned"
model = "claude-sonnet-5-5"
reasoning_effort = "high"

[profiles."cc.deepthink"]
selection_mode = "pinned"
model = "claude-opus-5-5"
reasoning_effort = "xhigh"

[profiles."cc.pro"]
selection_mode = "pinned"
model = "claude-fable-5-1"
reasoning_effort = "high"

[profiles."ag.standard"]
selection_mode = "pinned"
model = "gemini-3.8-flash-low"

[profiles."ag.effort"]
selection_mode = "pinned"
model = "gemini-3.8-flash-high"

[profiles."ag.deepthink"]
selection_mode = "pinned"
model = "gemini-3.1-pro-low"

[profiles."ag.pro"]
selection_mode = "pinned"
model = "gemini-3.1-pro-high"

# Wildcard: any profile without its own entry above (e.g. a custom/future
# adapter with no known model-drift risk) defaults to cli_default rather
# than a hard configuration error -- there is no specific model string to
# go stale for a profile nothing here has ever heard of. A known vendor
# profile always matches its own entry above first;
# this only ever applies to something genuinely unconfigured anywhere.
#
# NOTE: every profile currently advertised by the three production adapters is
# explicit above. The wildcard is only for genuinely custom/future adapters.
[profiles."*"]
selection_mode = "cli_default"

