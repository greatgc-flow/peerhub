# Packaged model defaults, bundled inside the peerhub distribution.
#
# Explicit profiles are resolved by peerhub/extensions/adapters/profiles.py.
# Per-key precedence: workspace (.peerhub/config/models.toml) > global
# (PEERHUB_CONFIG_HOME/models.toml, default ~/.peerhub/config/models.toml)
# > this packaged file. No profile is selected implicitly; unknown names
# raise a configuration error. Packaged entries are release-maintained.

schema_version = 1
defaults_revision = "2026-10-08.1"

[profiles."cx.standard"]
selection_mode = "pinned"
model = "gpt-6-luna"
reasoning_effort = "low"

[profiles."cx.effort"]
selection_mode = "pinned"
model = "gpt-6.1-sol"
reasoning_effort = "high"

[profiles."cx.deepthink"]
selection_mode = "pinned"
model = "gpt-6.1-sol"
reasoning_effort = "xhigh"

[profiles."cx.pro"]
selection_mode = "pinned"
model = "gpt-6-astra"
reasoning_effort = "xhigh"

[profiles."cc.standard"]
